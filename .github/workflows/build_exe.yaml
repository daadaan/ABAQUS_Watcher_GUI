name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Extract Version from Source
      id: get_version
      shell: pwsh
      # CHANGED: Pointing to your specific file name
      run: |
        $version = (Select-String -Path "abaqus_watcher_gui.py" -Pattern 'CURRENT_VERSION = "(.+)"').Matches.Groups[1].Value
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Detected version: $version"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile `
          --exclude-module unittest `
          --exclude-module pdb `
          --exclude-module difflib `
          --exclude-module doctest `
          --name "ABAQUSWatcherGUI_v${{ steps.get_version.outputs.VERSION }}" abaqus_watcher_gui.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ABAQUSWatcherGUI_v${{ steps.get_version.outputs.VERSION }}
        path: dist/ABAQUSWatcherGUI_v${{ steps.get_version.outputs.VERSION }}.exe

    - name: Upload EXE to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ABAQUSWatcherGUI_v${{ steps.get_version.outputs.VERSION }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}